button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{
  width:min(1150px,94%);
  margin:auto;
  padding:28px 0 60px;
}
.header{
  background:var(--paper);
  padding:25px 28px;
  border:2px solid #d3c3b1;
  border-radius:8px;
  box-shadow:4px 5px 0 rgba(37,27,45,.25);
  transform:rotate(-.25deg);
  position:relative;
}
.header:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:9px;
  border-bottom:2px dashed #d9cdbf;
  opacity:.7;
}
.header h1{
  margin:0 0 5px;
  font-family:Georgia,serif;
  font-size:clamp(30px,6vw,48px);
}
.header p{margin:0 0 18px;color:var(--muted)}
.tabs{
  display:flex;gap:8px;flex-wrap:wrap;
}
.tab{
  border:2px solid var(--ink);
  background:var(--paper2);
  color:var(--ink);
  padding:10px 15px;
  border-radius:5px 7px 4px 6px;
  box-shadow:2px 2px 0 var(--ink);
}
.tab.active{background:#dba4f2}
.page{display:none;margin-top:24px}
.page.active{display:block}
.sheet{
  background:var(--paper);
  border:2px solid #d3c3b1;
  border-radius:7px;
  padding:22px;
  box-shadow:5px 6px 0 rgba(37,27,45,.24);
  background-image:repeating-linear-gradient(
    to bottom, transparent 0, transparent 31px, rgba(132,91,156,.10) 32px
  );
}
.section-title{
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  flex-wrap:wrap;margin-bottom:14px;
}
.section-title h2{font-family:Georgia,serif;margin:0}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:2px solid var(--ink);
  border-radius:5px;
  padding:9px 13px;
  background:#fff;
  box-shadow:2px 2px 0 var(--ink);
}
.btn.primary{background:#dca4f3}
.btn.success{background:#bfe2c9}
.btn.danger{background:#f0c0c7}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.filters{
  display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px;
}
.filter{
  border:1px dashed #766477;
  background:#fffaf1;
  padding:7px 10px;border-radius:12px;
}
.filter.active{background:#dba4f2;border-style:solid}
.project-list{display:grid;gap:12px}
.project{
  position:relative;
  background:#fffdf8;
  border:1px solid #cfc0af;
  border-left:7px solid #b94eea;
  padding:15px 15px 13px;
  box-shadow:2px 3px 0 rgba(37,27,45,.13);
}
.project h3{margin:0 0 5px;font-family:Georgia,serif}
.project p{margin:5px 0;color:#5d5263;white-space:pre-wrap}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.badge{
  display:inline-block;padding:4px 8px;border-radius:10px;
  font-size:12px;border:1px solid #b9a7b9;background:#f3eaf5;
}
.priority-high{background:#f5c5cd}
.priority-medium{background:#f4dfad}
.priority-low{background:#cfe7d6}
.project-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.characters{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:16px;
}
.character{
  background:#fffdf8;
  border:1px solid #cfc0af;
  padding:11px;
  box-shadow:3px 3px 0 rgba(37,27,45,.14);
}
.character-cover{
  width:100%;aspect-ratio:1/1;object-fit:cover;
  background:#eee1f0;border:1px solid #c7b6c9;
}
.character h3{font-family:Georgia,serif;margin:9px 0 3px}
.character small{color:var(--muted)}
.modal{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(26,13,32,.65);padding:18px;z-index:20;
}
.modal.open{display:flex}
.modal-box{
  width:min(620px,100%);max-height:90vh;overflow:auto;
  background:var(--paper);border:2px solid var(--ink);padding:22px;
  box-shadow:7px 8px 0 rgba(0,0,0,.35);
}
.modal-box h2{font-family:Georgia,serif;margin-top:0}
.form-grid{display:grid;gap:12px}
label{font-weight:bold}
input,textarea,select{
  width:100%;padding:10px;border:1px solid #bbaaa0;
  border-radius:4px;background:#fffdf8;color:var(--ink);
}
textarea{min-height:105px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.art-gallery{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px;
}
.art-card{border:1px solid #cfc0af;background:#fffdf8;padding:6px}
.art-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.art-card button{width:100%;margin-top:5px}
.character-view{display:none}
.character-view.active{display:block}
.back{margin-bottom:12px}
.note{
  color:var(--muted);font-size:13px;margin-top:8px;
}
@media(max-width:650px){
  .app{width:96%;padding-top:12px}
  .sheet{padding:15px}
  .header{padding:20px 17px}
  .tab{flex:1;text-align:center}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>✎ My Art Dashboard</h1>
    <p>A place for my projects, characters, and all the art that goes with them.</p>
    <div class="tabs">
      <button class="tab active" data-page="todo">📋 To-Do</button>
      <button class="tab" data-page="completed">✓ Completed</button>
      <button class="tab" data-page="characters">🧍 Characters</button>
    </div>
  </header>

  <main>
    <section id="todo" class="page active">
      <div class="sheet">
        <div class="section-title">
          <h2>Things to draw</h2>
          <button class="btn primary" onclick="openProjectModal()">＋ New Project</button>
        </div>
        <div id="todoFilters" class="filters"></div>
        <div id="todoList" class="project-list"></div>
      </div>
    </section>

    <section id="completed" class="page">
      <div class="sheet">
        <div class="section-title">
          <h2>Finished work</h2>
          <button class="btn" onclick="clearCompleted()">Clear Completed</button>
        </div>
        <div id="completedList" class="project-list"></div>
      </div>
    </section>

    <section id="characters" class="page">
      <div class="sheet">
        <div class="section-title">
          <h2>Character Archive</h2>
          <button class="btn primary" onclick="openCharacterModal()">＋ New Character</button>
        </div>
        <div id="characterGrid" class="characters"></div>
      </div>
    </section>

    <section id="characterView" class="page">
      <div class="sheet">
        <button class="btn back" onclick="showPage('characters')">← Back to Characters</button>
        <div class="section-title">
          <div>
            <h2 id="characterName"></h2>
            <div id="characterDescription" class="note"></div>
          </div>
          <div class="controls">
            <button class="btn primary" onclick="document.getElementById('artUpload').click()">＋ Add Art</button>
            <button class="btn danger" onclick="deleteCurrentCharacter()">Delete Character</button>
          </div>
        </div>
        <input id="artUpload" type="file" accept="image/*" multiple hidden onchange="addCharacterArt(event)">
        <div id="artGallery" class="art-gallery"></div>
      </div>
    </section>
  </main>
</div>

<!-- Project modal -->
<div id="projectModal" class="modal">
  <div class="modal-box">
    <h2 id="projectModalTitle">New Art Project</h2>
    <form id="projectForm" class="form-grid">
      <input id="projectId" type="hidden">
      <div><label>Title</label><input id="projectTitle" required placeholder="e.g. Draw Malice reference"></div>
      <div><label>Description</label><textarea id="projectDescription" placeholder="What do you want to do?"></textarea></div>
      <div><label>Category</label>
        <select id="projectCategory">
          <option>Characters</option>
          <option>Animations</option>
          <option>References</option>
          <option>Ideas</option>
          <option>Scrapped Ideas / Characters</option>
          <option>Trades</option>
        </select>
      </div>
      <div><label>Priority</label>
        <select id="projectPriority">
          <option>High</option><option selected>Medium</option><option>Low</option>
        </select>
      </div>
      <div><label>Due date</label><input id="projectDue" type="date"></div>
      <div class="form-actions">
        <button type="button" class="btn" onclick="closeModal('projectModal')">Cancel</button>
        <button type="submit" class="btn primary">Save Project</button>
      </div>
    </form>
  </div>
</div>

<!-- Character modal -->
<div id="characterModal" class="modal">
  <div class="modal-box">
    <h2>New Character</h2>
    <form id="characterForm" class="form-grid">
      <div><label>Name</label><input id="characterNameInput" required placeholder="Character name"></div>
      <div><label>Description</label><textarea id="characterDescriptionInput" placeholder="Anything you want to remember about them..."></textarea></div>
      <div><label>Cover image (optional)</label><input id="characterCoverInput" type="file" accept="image/*"></div>
      <div class="form-actions">
        <button type="button" class="btn" onclick="closeModal('characterModal')">Cancel</button>
        <button type="submit" class="btn primary">Create Character</button>
      </div>
    </form>
  </div>
</div>

<script>
const CATEGORIES = ["All","Characters","Animations","References","Ideas","Scrapped Ideas / Characters"];
let projects = JSON.parse(localStorage.getItem("artProjects") || "[]");
let activeFilter = "All";
let currentCharacterId = null;
let db;

function saveProjects(){ localStorage.setItem("artProjects", JSON.stringify(projects)); }

function escapeHTML(s=""){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function makeId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function formatDate(v){ if(!v) return "No due date"; const d=new Date(v+"T00:00:00"); return d.toLocaleDateString(); }

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.page===id));
  if(id==="characters") renderCharacters();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>showPage(t.dataset.page)));

function renderFilters(){
  const el=document.getElementById("todoFilters");
  el.innerHTML=CATEGORIES.map(c=>`<button class="filter ${c===activeFilter?'active':''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`).join("");
}
function setFilter(c){activeFilter=c;renderProjects();}

function projectCard(p, completed=false){
  return `<article class="project">
    <h3>${escapeHTML(p.title)}</h3>
    <p>${escapeHTML(p.description || "No description.")}</p>
    <div class="meta">
      <span class="badge">${escapeHTML(p.category)}</span>
      <span class="badge priority-${p.priority.toLowerCase()}">${escapeHTML(p.priority)} priority</span>
      <span class="badge">Due: ${formatDate(p.due)}</span>
    </div>
    <div class="project-actions">
      ${completed
        ? `<button class="btn" onclick="restoreProject('${p.id}')">↩ Restore</button>`
        : `<button class="btn success" onclick="completeProject('${p.id}')">✓ Complete</button>`}
      <button class="btn" onclick="moveProject('${p.id}',-1)">↑</button>
      <button class="btn" onclick="moveProject('${p.id}',1)">↓</button>
      <button class="btn" onclick="editProject('${p.id}')">✎ Edit</button>
      <button class="btn danger" onclick="deleteProject('${p.id}')">Delete</button>
    </div>
  </article>`;
}
function renderProjects(){
  renderFilters();
  const todo=document.getElementById("todoList");
  const completed=document.getElementById("completedList");
  let t=projects.filter(p=>!p.completed && (activeFilter==="All"||p.category===activeFilter));
  let c=projects.filter(p=>p.completed);
  todo.innerHTML=t.length?t.map(p=>projectCard(p)).join(""):`<div class="empty">Nothing here yet. Add a project above!</div>`;
  completed.innerHTML=c.length?c.map(p=>projectCard(p,true)).join(""):`<div class="empty">No completed projects yet.</div>`;
}
function openProjectModal(id=null){
  document.getElementById("projectModal").classList.add("open");
  document.getElementById("projectModalTitle").textContent=id?"Edit Art Project":"New Art Project";
  const p=projects.find(x=>x.id===id);
  document.getElementById("projectId").value=p?.id||"";
  document.getElementById("projectTitle").value=p?.title||"";
  document.getElementById("projectDescription").value=p?.description||"";
  document.getElementById("projectCategory").value=p?.category||"Characters";
  document.getElementById("projectPriority").value=p?.priority||"Medium";
  document.getElementById("projectDue").value=p?.due||"";
}
function editProject(id){openProjectModal(id)}
function closeModal(id){document.getElementById(id).classList.remove("open")}
document.getElementById("projectForm").addEventListener("submit",e=>{
  e.preventDefault();
  const id=document.getElementById("projectId").value;
  const data={
    id:id||makeId(),
    title:document.getElementById("projectTitle").value.trim(),
    description:document.getElementById("projectDescription").value.trim(),
    category:document.getElementById("projectCategory").value,
    priority:document.getElementById("projectPriority").value,
    due:document.getElementById("projectDue").value,
    completed:id?(projects.find(p=>p.id===id)?.completed||false):false
  };
  if(id){const i=projects.findIndex(p=>p.id===id);projects[i]=data}
  else projects.push(data);
  saveProjects();renderProjects();closeModal("projectModal");
});
function completeProject(id){const p=projects.find(x=>x.id===id);if(p){p.completed=true;saveProjects();renderProjects()}}
function restoreProject(id){const p=projects.find(x=>x.id===id);if(p){p.completed=false;saveProjects();renderProjects()}}
function deleteProject(id){if(confirm("Delete this project?")){projects=projects.filter(p=>p.id!==id);saveProjects();renderProjects()}}
function moveProject(id,dir){
  const active=projects.filter(p=>!p.completed && (activeFilter==="All"||p.category===activeFilter));
  const index=active.findIndex(p=>p.id===id);
  const other=index+dir;
  if(index<0||other<0||other>=active.length)return;
  const a=projects.findIndex(p=>p.id===active[index].id);
  const b=projects.findIndex(p=>p.id===active[other].id);
  [projects[a],projects[b]]=[projects[b],projects[a]];
  saveProjects();renderProjects();
}
function clearCompleted(){if(confirm("Remove all completed projects?")){projects=projects.filter(p=>!p.completed);saveProjects();renderProjects()}}

function openCharacterModal(){document.getElementById("characterModal").classList.add("open")}
document.getElementById("characterForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=document.getElementById("characterNameInput").value.trim();
  const description=document.getElementById("characterDescriptionInput").value.trim();
  const file=document.getElementById("characterCoverInput").files[0];
  const cover=file?await fileToDataURL(file):"";
  await idbPut({id:makeId(),name,description,cover,art:[]});
  closeModal("characterModal");e.target.reset();renderCharacters();
});
function fileToDataURL(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})
}
function initDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("SketchbookDB",1);
    req.onupgradeneeded=()=>req.result.createObjectStore("characters",{keyPath:"id"});
    req.onsuccess=()=>{db=req.result;resolve()};
    req.onerror=()=>reject(req.error);
  });
}
function idbPut(obj){return new Promise((res,rej)=>{const tx=db.transaction("characters","readwrite");tx.objectStore("characters").put(obj);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function idbGetAll(){return new Promise((res,rej)=>{const r=db.transaction("characters").objectStore("characters").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbGet(id){return new Promise((res,rej)=>{const r=db.transaction("characters").objectStore("characters").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbDelete(id){return new Promise((res,rej)=>{const tx=db.transaction("characters","readwrite");tx.objectStore("characters").delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

async function renderCharacters(){
  const chars=await idbGetAll();
  const grid=document.getElementById("characterGrid");
  grid.innerHTML=chars.length?chars.map(c=>`
    <article class="character">
      ${c.cover?`<img class="character-cover" src="${c.cover}" alt="">`:`<div class="character-cover"></div>`}
      <h3>${escapeHTML(c.name)}</h3>
      <small>${escapeHTML(c.description||"No description.")}</small>
      <div class="project-actions">
        <button class="btn primary" onclick="openCharacter('${c.id}')">Open Archive</button>
      </div>
    </article>`).join(""):`<div class="empty">No characters yet. Add your first character!</div>`;
}
async function openCharacter(id){
  currentCharacterId=id;
  const c=await idbGet(id);
  document.getElementById("characterName").textContent=c.name;
  document.getElementById("characterDescription").textContent=c.description||"";
  document.getElementById("artGallery").innerHTML="";
  renderCharacterArt(c);
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("characterView").classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
}
function renderCharacterArt(c){
  const g=document.getElementById("artGallery");
  g.innerHTML=c.art.length?c.art.map((a,i)=>`
    <div class="art-card">
      <img src="${a.data}" alt="${escapeHTML(a.name||"Character art")}">
      <button class="btn danger" onclick="deleteCharacterArt(${i})">Delete</button>
    </div>`).join(""):`<div class="empty">No art uploaded yet. Use “＋ Add Art”.</div>`;
}
async function addCharacterArt(event){
  const files=[...event.target.files];
  if(!currentCharacterId||!files.length)return;
  const c=await idbGet(currentCharacterId);
  for(const file of files)c.art.push({id:makeId(),name:file.name,data:await fileToDataURL(file)});
  await idbPut(c);event.target.value="";renderCharacterArt(c);
}
async function deleteCharacterArt(index){
  const c=await idbGet(currentCharacterId);
  c.art.splice(index,1);await idbPut(c);renderCharacterArt(c);
}
async function deleteCurrentCharacter(){
  if(confirm("Delete this character and all of its uploaded art?")){
    await idbDelete(currentCharacterId);currentCharacterId=null;showPage("characters");
  }
}

(async()=>{
  await initDB();
  renderProjects();
  renderCharacters();
})();
</script>
</body>
</html>
